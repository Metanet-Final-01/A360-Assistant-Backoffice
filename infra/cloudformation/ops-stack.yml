AWSTemplateFormatVersion: "2010-09-09"
Description: A360 Assistant Ops stack - private single-instance Ops/RAG deployment accessed directly through Client VPN.

Parameters:
  ProjectName:
    Type: String
    Default: a360-assistant
  Environment:
    Type: String
    Default: dev
  Owner:
    Type: String
    Default: team1
  OpsBackendImageUri:
    Type: String
    Description: Immutable image URI for ops-server/backend. Use a Git commit SHA tag, not latest.
  OpsUiImageUri:
    Type: String
    Description: Immutable image URI for ops-server/frontend Streamlit. Use a Git commit SHA tag, not latest.
  RagServerImageUri:
    Type: String
    Description: Immutable image URI for rag-server. Use a Git commit SHA tag, not latest.
  InstanceType:
    Type: String
    Default: t3.small
  MinSize:
    Type: Number
    Default: 1
  DesiredCapacity:
    Type: Number
    Default: 1
  MaxSize:
    Type: Number
    Default: 1
  OpsBackendPort:
    Type: Number
    Default: 8100
  OpsUiPort:
    Type: Number
    Default: 8501
  RagServerPort:
    Type: Number
    Default: 8200
  EnableRagWorker:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Run a separate SQS consumer container for scheduled RAG ingest jobs.
  EnableDefaultRagIngestSchedule:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create a default EventBridge Scheduler schedule that sends RAG ingest jobs to SQS.
  RagIngestScheduleExpression:
    Type: String
    Default: cron(30 8 ? * * *)
    Description: Default scheduled RAG ingest time in RagIngestScheduleTimezone.
  RagIngestScheduleTimezone:
    Type: String
    Default: Asia/Seoul
  RagIngestClean:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Whether the scheduled ingest should clean existing RAG corpus before ingest.
  ClientVpnCidr:
    Type: String
    Default: 10.250.0.0/22
  ClientVpnSecurityGroupId:
    Type: String
    Default: ""
    Description: Optional Client VPN endpoint security group ID. When set, the Ops EC2 accepts direct UI/API traffic from this SG as well as ClientVpnCidr.
  EnableOpsPrivateDns:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create a Route53 private DNS name for the single Ops EC2 instance.
  OpsPrivateHostedZoneName:
    Type: String
    Default: dev.a360.internal
    Description: Route53 private hosted zone name associated with the A360 VPC.
  OpsPrivateDnsRecordName:
    Type: String
    Default: ops.dev.a360.internal
    Description: Private DNS record that points to the current Ops EC2 private IP.
  LogRetentionDays:
    Type: Number
    Default: 14
  RagServiceTokenSecretArn:
    Type: String
    Default: ""
    Description: Optional Secret ARN containing RAG_SERVICE_TOKEN.
  OpsRuntimeSecretArn:
    Type: String
    Default: ""
    Description: Optional Secret ARN containing extra runtime env vars for ops-backend and rag-server.
  A360BackendUrl:
    Type: String
    Default: ""
    Description: Optional main A360 backend URL that Ops Backend probes/admin-calls.
  BackendRuntimeSecretName:
    Type: String
    Default: ""
    Description: >-
      Optional Backend runtime Secret name. Defaults to
      ProjectName/Environment/backend-app when empty.
  GhcrUsername:
    Type: String
    Default: ""
  GhcrTokenSecretArn:
    Type: String
    Default: ""
    Description: Optional existing Secret ARN for GHCR token. Leave empty to let this stack create a retained secret shell.

Conditions:
  HasExternalRagTokenSecret: !Not [!Equals [!Ref RagServiceTokenSecretArn, ""]]
  HasExternalOpsRuntimeSecret: !Not [!Equals [!Ref OpsRuntimeSecretArn, ""]]
  HasBackendUrl: !Not [!Equals [!Ref A360BackendUrl, ""]]
  HasBackendRuntimeSecretName: !Not [!Equals [!Ref BackendRuntimeSecretName, ""]]
  HasExternalGhcrTokenSecret: !Not [!Equals [!Ref GhcrTokenSecretArn, ""]]
  HasClientVpnSecurityGroup: !Not [!Equals [!Ref ClientVpnSecurityGroupId, ""]]
  CreateGhcrTokenSecret: !Equals [!Ref GhcrTokenSecretArn, ""]
  CreateOpsRuntimeSecret: !Equals [!Ref OpsRuntimeSecretArn, ""]
  CreateRagServiceTokenSecret: !Equals [!Ref RagServiceTokenSecretArn, ""]
  RunsRagWorker: !Equals [!Ref EnableRagWorker, "true"]
  CreatesDefaultRagIngestSchedule: !Equals [!Ref EnableDefaultRagIngestSchedule, "true"]
  CreatesOpsPrivateDns: !Equals [!Ref EnableOpsPrivateDns, "true"]

Resources:
  OpsGhcrReadTokenSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateGhcrTokenSecret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${ProjectName}/${Environment}/ops-ghcr-read-token
      Description: GHCR read token for private Ops container image pulls. Put the token value after stack creation.
      SecretString: REPLACE_ME
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: Service
          Value: ops

  OpsRuntimeSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateOpsRuntimeSecret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${ProjectName}/${Environment}/ops-runtime
      Description: Extra runtime environment variables for Ops backend and RAG server. Update the JSON value after stack creation.
      SecretString: "{}"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: Service
          Value: ops

  RagServiceTokenSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateRagServiceTokenSecret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${ProjectName}/${Environment}/rag-service-token
      Description: Shared bearer token used between Ops backend and rag-server. Put the token value after stack creation.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: Service
          Value: ops

  OpsInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ops EC2 container host accessed directly through Client VPN
      VpcId:
        Fn::ImportValue:
          Fn::Sub: "${ProjectName}-${Environment}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref OpsUiPort
          ToPort: !Ref OpsUiPort
          CidrIp: !Ref ClientVpnCidr
        - IpProtocol: tcp
          FromPort: !Ref OpsBackendPort
          ToPort: !Ref OpsBackendPort
          CidrIp: !Ref ClientVpnCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  OpsUiIngressFromClientVpnSecurityGroup:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasClientVpnSecurityGroup
    Properties:
      GroupId: !Ref OpsInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref OpsUiPort
      ToPort: !Ref OpsUiPort
      SourceSecurityGroupId: !Ref ClientVpnSecurityGroupId
      Description: Allow Client VPN endpoint security group to reach the Ops Streamlit UI directly.

  OpsBackendIngressFromClientVpnSecurityGroup:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasClientVpnSecurityGroup
    Properties:
      GroupId: !Ref OpsInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref OpsBackendPort
      ToPort: !Ref OpsBackendPort
      SourceSecurityGroupId: !Ref ClientVpnSecurityGroupId
      Description: Allow Client VPN endpoint security group to reach the Ops backend API directly.

  OpsPrivateHostedZone:
    Type: AWS::Route53::HostedZone
    Condition: CreatesOpsPrivateDns
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref OpsPrivateHostedZoneName
      HostedZoneConfig:
        Comment: !Sub "Private DNS zone for ${ProjectName} ${Environment} Ops access."
      VPCs:
        - VPCId:
            Fn::ImportValue:
              Fn::Sub: "${ProjectName}-${Environment}-VpcId"
          VPCRegion: !Ref AWS::Region
      HostedZoneTags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: Service
          Value: ops

  ObservabilityDbIngressFromOps:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue:
          Fn::Sub: "${ProjectName}-${Environment}-ObservabilityDbSecurityGroupId"
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref OpsInstanceSecurityGroup

  RagDbIngressFromOps:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue:
          Fn::Sub: "${ProjectName}-${Environment}-RagDbSecurityGroupId"
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref OpsInstanceSecurityGroup

  OpsBackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/a360/${Environment}/ops-api"
      RetentionInDays: !Ref LogRetentionDays

  OpsUiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/a360/${Environment}/ops-ui"
      RetentionInDays: !Ref LogRetentionDays

  RagServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/a360/${Environment}/rag-server"
      RetentionInDays: !Ref LogRetentionDays

  RagWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: RunsRagWorker
    Properties:
      LogGroupName: !Sub "/a360/${Environment}/rag-worker-cfn"
      RetentionInDays: !Ref LogRetentionDays

  RagAopEventLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/a360/${Environment}/rag-aop-events"
      RetentionInDays: !Ref LogRetentionDays

  OpsEvalLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/a360/${Environment}/ops-eval"
      RetentionInDays: !Ref LogRetentionDays

  OpsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: ops-runtime-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "${OpsBackendLogGroup.Arn}:*"
                  - !Sub "${OpsUiLogGroup.Arn}:*"
                  - !Sub "${RagServerLogGroup.Arn}:*"
                  - !If
                    - RunsRagWorker
                    - !Sub "${RagWorkerLogGroup.Arn}:*"
                    - !Ref AWS::NoValue
              - Effect: Allow
                Action:
                  - cloudformation:SignalResource
                Resource: !Ref AWS::StackId
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - Fn::Sub:
                      - "arn:${AWS::Partition}:s3:::${BucketName}"
                      - BucketName:
                          Fn::ImportValue:
                            Fn::Sub: "${ProjectName}-${Environment}-ArtifactBucketName"
                  - Fn::Sub:
                      - "arn:${AWS::Partition}:s3:::${BucketName}/*"
                      - BucketName:
                          Fn::ImportValue:
                            Fn::Sub: "${ProjectName}-${Environment}-ArtifactBucketName"
              - !If
                - CreatesOpsPrivateDns
                - Effect: Allow
                  Action: route53:ChangeResourceRecordSets
                  Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${OpsPrivateHostedZone}"
                - !Ref AWS::NoValue
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource:
                  Fn::ImportValue:
                    Fn::Sub: "${ProjectName}-${Environment}-RagJobQueueArn"
              - Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:GetSchedule
                  - scheduler:ListSchedules
                Resource:
                  - !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ProjectName}-${Environment}-rag-ingest/*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt RagScheduleRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - Fn::ImportValue:
                      Fn::Sub: "${ProjectName}-${Environment}-OpsReaderSecretArn"
                  - Fn::ImportValue:
                      Fn::Sub: "${ProjectName}-${Environment}-RagIngestSecretArn"
                  - !If [HasExternalRagTokenSecret, !Ref RagServiceTokenSecretArn, !Ref RagServiceTokenSecret]
                  - !If [HasExternalOpsRuntimeSecret, !Ref OpsRuntimeSecretArn, !Ref OpsRuntimeSecret]
                  - !If [HasExternalGhcrTokenSecret, !Ref GhcrTokenSecretArn, !Ref OpsGhcrReadTokenSecret]
                  - !Sub
                    - "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BackendRuntimeSecretPath}-*"
                    - BackendRuntimeSecretPath: !If
                        - HasBackendRuntimeSecretName
                        - !Ref BackendRuntimeSecretName
                        - !Sub "${ProjectName}/${Environment}/backend-app"

  OpsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref OpsInstanceRole]

  OpsLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      Comment: Runs ops-backend, ops-ui, and rag-server containers on a private EC2 host.
    Properties:
      LaunchTemplateData:
        IamInstanceProfile:
          Arn: !GetAtt OpsInstanceProfile.Arn
        ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        InstanceType: !Ref InstanceType
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        Monitoring:
          Enabled: true
        NetworkInterfaces:
          - AssociatePublicIpAddress: false
            DeviceIndex: 0
            Groups: [!Ref OpsInstanceSecurityGroup]
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              Encrypted: true
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -euo pipefail
              exec > >(tee -a /var/log/a360-ops-bootstrap.log /var/log/cloud-init-output.log) 2>&1
              dnf install -y amazon-cloudwatch-agent
              mkdir -p /opt/a360 /opt/a360/rag-server-data /opt/a360/rag-server-logs /opt/a360/ops-backend-data
              chmod 700 /opt/a360
              chown -R 1000:1000 /opt/a360/rag-server-data /opt/a360/rag-server-logs /opt/a360/ops-backend-data
              mkdir -p /opt/aws/amazon-cloudwatch-agent/etc
              cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'CWEOF'
              {
                "agent": { "run_as_user": "root", "force_flush_interval": 5 },
                "metrics": {
                  "append_dimensions": {
                    "AutoScalingGroupName": "${!aws:AutoScalingGroupName}",
                    "InstanceId": "${!aws:InstanceId}"
                  },
                  "metrics_collected": {
                    "mem": {
                      "measurement": ["mem_used_percent"],
                      "metrics_collection_interval": 60
                    }
                  }
                },
                "logs": {
                  "logs_collected": {
                    "files": {
                      "collect_list": [
                        {
                          "file_path": "/opt/a360/rag-server-logs/*.jsonl",
                          "log_group_name": "${RagLogGroup}",
                          "log_stream_name": "{instance_id}/rag-aop-events",
                          "timezone": "UTC"
                        },
                        {
                          "file_path": "/opt/a360/ops-backend-data/eval_runs.jsonl",
                          "log_group_name": "${OpsApiLogGroup}",
                          "log_stream_name": "{instance_id}/ops-eval-runs",
                          "timezone": "UTC"
                        },
                        {
                          "file_path": "/opt/a360/ops-backend-data/observability_*.jsonl",
                          "log_group_name": "${OpsApiLogGroup}",
                          "log_stream_name": "{instance_id}/ops-observability-snapshots",
                          "timezone": "UTC"
                        }
                      ]
                    }
                  }
                }
              }
              CWEOF
              /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
                -a fetch-config -m ec2 \
                -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

              dnf install -y docker awscli jq aws-cfn-bootstrap
              IMDS_TOKEN=$(curl -fsS -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" || true)
              INSTANCE_ID=$(curl -fsS -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/instance-id || echo unknown-instance)
              PRIVATE_IP=$(curl -fsS -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4 || true)
              upload_bootstrap_logs() {
                aws s3 cp /var/log/a360-ops-bootstrap.log "s3://${ArtifactBucketName}/ops-bootstrap-logs/${AWS::StackName}/$INSTANCE_ID/a360-ops-bootstrap.log" || true
                aws s3 cp /var/log/cloud-init-output.log "s3://${ArtifactBucketName}/ops-bootstrap-logs/${AWS::StackName}/$INSTANCE_ID/cloud-init-output.log" || true
              }
              trap 'upload_bootstrap_logs; /opt/aws/bin/cfn-signal --success false --stack ${AWS::StackName} --resource OpsAutoScalingGroup --region ${AWS::Region}' ERR
              systemctl enable --now docker

              ${UpsertOpsPrivateDns}

              restore_rag_artifacts() {
                local bucket="${ArtifactBucketName}"
                local latest_key="rag-ingest-artifacts/latest/rag-server-data.tar.gz"
                local restore_key=""
                if [ -s /opt/a360/rag-server-data/ingest/rag_documents.jsonl ]; then
                  echo "RAG artifacts already present; skip S3 restore"
                  return 0
                fi
                if aws s3api head-object --bucket "$bucket" --key "$latest_key" >/dev/null 2>&1; then
                  restore_key="$latest_key"
                else
                  restore_key=$(aws s3api list-objects-v2 \
                    --bucket "$bucket" \
                    --prefix "rag-ingest-artifacts/manual-backup/" \
                    --query "sort_by(Contents[?ends_with(Key, '.tar.gz')], &LastModified)[-1].Key" \
                    --output text 2>/dev/null || true)
                  if [ "$restore_key" = "None" ]; then
                    restore_key=""
                  fi
                fi
                if [ -z "$restore_key" ]; then
                  echo "No RAG artifact archive found in S3; cold boot keeps empty ingest data"
                  return 0
                fi
                echo "Restoring RAG artifacts from s3://$bucket/$restore_key"
                rm -rf /tmp/a360-rag-restore
                mkdir -p /tmp/a360-rag-restore
                aws s3 cp "s3://$bucket/$restore_key" /tmp/a360-rag-restore/rag-server-data.tar.gz
                if ! tar -tzf /tmp/a360-rag-restore/rag-server-data.tar.gz | awk 'BEGIN { bad = 0 } /^\\// || /(^|\\/)\\.\\.($|\\/)/ { bad = 1 } END { exit bad }'; then
                  echo "RAG artifact archive has unsafe paths; skip restore" >&2
                  return 0
                fi
                if ! tar -tvzf /tmp/a360-rag-restore/rag-server-data.tar.gz | awk 'BEGIN { bad = 0 } $1 ~ /^[lh]/ { bad = 1 } END { exit bad }'; then
                  echo "RAG artifact archive contains links; skip restore" >&2
                  return 0
                fi
                tar --no-same-owner --no-same-permissions -xzf /tmp/a360-rag-restore/rag-server-data.tar.gz -C /tmp/a360-rag-restore
                if [ -d /tmp/a360-rag-restore/rag-server-data ]; then
                  cp -a /tmp/a360-rag-restore/rag-server-data/. /opt/a360/rag-server-data/
                elif [ -d /tmp/a360-rag-restore/rag-server-data-backup ]; then
                  cp -a /tmp/a360-rag-restore/rag-server-data-backup/. /opt/a360/rag-server-data/
                elif [ -d /tmp/a360-rag-restore/data ]; then
                  cp -a /tmp/a360-rag-restore/data/. /opt/a360/rag-server-data/
                else
                  echo "RAG artifact archive has unsupported root layout" >&2
                  return 0
                fi
                chown -R 1000:1000 /opt/a360/rag-server-data
                echo "RAG artifact restore complete"
              }
              restore_rag_artifacts || echo "RAG artifact restore skipped; continuing bootstrap" >&2
              umask 077
              aws secretsmanager get-secret-value --secret-id '${OpsReaderSecretArn}' --query SecretString --output text > /opt/a360/ops_reader.json
              aws secretsmanager get-secret-value --secret-id '${RagIngestSecretArn}' --query SecretString --output text > /opt/a360/rag_ingest.json
              ${ReadGhcrSecret}
              ${ReadRagTokenSecret}
              ${ReadBackendRuntimeSecret}
              ${ReadOpsRuntimeSecret}
              cat /opt/a360/runtime.backend.env /opt/a360/runtime.override.env > /opt/a360/runtime.env
              chmod 600 /opt/a360/ops_reader.json /opt/a360/rag_ingest.json /opt/a360/ghcr_token /opt/a360/rag_service_token /opt/a360/runtime.env 2>/dev/null || true

              OPS_DB_USER=$(jq -r '.username' /opt/a360/ops_reader.json)
              OPS_DB_PASSWORD=$(jq -r '.password' /opt/a360/ops_reader.json)
              RAG_DB_USER=$(jq -r '.username' /opt/a360/rag_ingest.json)
              RAG_DB_PASSWORD=$(jq -r '.password' /opt/a360/rag_ingest.json)
              OPS_DB_USER_ENC=$(jq -rn --arg v "$OPS_DB_USER" '$v|@uri')
              OPS_DB_PASSWORD_ENC=$(jq -rn --arg v "$OPS_DB_PASSWORD" '$v|@uri')
              RAG_DB_USER_ENC=$(jq -rn --arg v "$RAG_DB_USER" '$v|@uri')
              RAG_DB_PASSWORD_ENC=$(jq -rn --arg v "$RAG_DB_PASSWORD" '$v|@uri')
              OBS_DSN="postgresql://$OPS_DB_USER_ENC:$OPS_DB_PASSWORD_ENC@${ObservabilityDbEndpoint}:5432/${ObservabilityDbName}?sslmode=require"
              RAG_DSN="postgresql://$RAG_DB_USER_ENC:$RAG_DB_PASSWORD_ENC@${RagDbEndpoint}:5432/${RagDbName}?sslmode=require"

              GHCR_USERNAME='${GhcrUsername}'
              if [ -s /opt/a360/ghcr_token ] && [ "$(cat /opt/a360/ghcr_token)" != "REPLACE_ME" ]; then
                if [ -z "$GHCR_USERNAME" ]; then
                  GHCR_USERNAME=token
                fi
                cat /opt/a360/ghcr_token | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
              fi

              docker network create a360 || true
              docker rm -f rag-server rag-worker ops-backend ops-ui || true

              docker run -d --restart unless-stopped --name rag-server --network a360 \
                -p ${RagServerPort}:${RagServerPort} \
                -v /opt/a360/rag-server-data:/app/data \
                -v /opt/a360/rag-server-logs:/app/app/rag/logs \
                --env-file /opt/a360/runtime.env \
                -e INGEST_DATA_DIR=/app/data/ingest \
                -e RAG_ARTIFACT_BUCKET="${ArtifactBucketName}" \
                -e RAG_ARTIFACT_PREFIX="rag-ingest-artifacts" \
                -e RAG_ARTIFACT_RESTORE_WAIT_SECONDS=20 \
                -e RAG_ARTIFACT_RESTORE_POLL_SECONDS=5 \
                -e RAG_LOG_DIR=/app/app/rag/logs \
                -e CHUNK_SIZE=1200 \
                -e CHUNK_OVERLAP=120 \
                -e CHUNK_SIZE_DOC_PAGE=1200 \
                -e CHUNK_OVERLAP_DOC_PAGE=120 \
                -e CHUNK_SIZE_ACTION_SCHEMA=1200 \
                -e CHUNK_OVERLAP_ACTION_SCHEMA=120 \
                -e RAG_DATABASE_URL="$RAG_DSN" \
                -e REDIS_URL='${RedisUrl}' \
                -e RAG_SERVICE_TOKEN="$(cat /opt/a360/rag_service_token 2>/dev/null || true)" \
                --log-driver awslogs --log-opt awslogs-region=${AWS::Region} --log-opt awslogs-group=${RagLogGroup} \
                ${RagServerImageUri}

              ${RunRagWorkerContainer}

              docker run -d --restart unless-stopped --name ops-backend --network a360 \
                -p ${OpsBackendPort}:${OpsBackendPort} \
                -v /opt/a360/ops-backend-data:/app/data \
                --env-file /opt/a360/runtime.env \
                -e A360_OBSERVABILITY_DATABASE_URL="$OBS_DSN" \
                -e REDIS_URL='${RedisUrl}' \
                -e RAG_SERVER_URL="http://rag-server:${RagServerPort}" \
                -e RAG_SERVICE_TOKEN="$(cat /opt/a360/rag_service_token 2>/dev/null || true)" \
                -e RAG_SCHEDULER_PROVIDER="eventbridge-sqs" \
                -e RAG_SCHEDULER_GROUP="${ProjectName}-${Environment}-rag-ingest" \
                -e RAG_SCHEDULER_ROLE_ARN="${RagScheduleRoleArn}" \
                -e RAG_INGEST_SQS_QUEUE_URL="${RagJobQueueUrl}" \
                -e RAG_INGEST_SQS_QUEUE_ARN="${RagJobQueueArn}" \
                ${BackendUrlEnv} \
                --log-driver awslogs --log-opt awslogs-region=${AWS::Region} --log-opt awslogs-group=${OpsApiLogGroup} \
                ${OpsBackendImageUri}

              docker run -d --restart unless-stopped --name ops-ui --network a360 \
                -p ${OpsUiPort}:${OpsUiPort} \
                -e OPS_BACKEND_URL="http://ops-backend:${OpsBackendPort}" \
                -e RAG_SERVER_URL="http://rag-server:${RagServerPort}" \
                --log-driver awslogs --log-opt awslogs-region=${AWS::Region} --log-opt awslogs-group=${OpsUiLogGroup} \
                ${OpsUiImageUri}

              check_url() {
                local name="$1"
                local url="$2"
                for attempt in $(seq 1 60); do
                  if curl -fsS --max-time 5 "$url" >/dev/null; then
                    echo "$name healthy"
                    return 0
                  fi
                  echo "waiting for $name ($attempt/60)"
                  sleep 5
                done
                echo "$name health check failed" >&2
                return 1
              }

              check_url rag-server "http://localhost:${RagServerPort}/health"
              check_url ops-backend "http://localhost:${OpsBackendPort}/health"
              check_url ops-ui "http://localhost:${OpsUiPort}/_stcore/health"

              /opt/aws/bin/cfn-signal --success true \
                --stack ${AWS::StackName} \
                --resource OpsAutoScalingGroup \
                --region ${AWS::Region}
              upload_bootstrap_logs
            - OpsReaderSecretArn:
                Fn::ImportValue:
                  Fn::Sub: "${ProjectName}-${Environment}-OpsReaderSecretArn"
              RagIngestSecretArn:
                Fn::ImportValue:
                  Fn::Sub: "${ProjectName}-${Environment}-RagIngestSecretArn"
              ObservabilityDbEndpoint:
                Fn::ImportValue:
                  Fn::Sub: "${ProjectName}-${Environment}-ObservabilityDbEndpoint"
              ObservabilityDbName:
                Fn::ImportValue:
                  Fn::Sub: "${ProjectName}-${Environment}-ObservabilityDbName"
              RagDbEndpoint:
                Fn::ImportValue:
                  Fn::Sub: "${ProjectName}-${Environment}-RagDbEndpoint"
              RagDbName:
                Fn::ImportValue:
                  Fn::Sub: "${ProjectName}-${Environment}-RagDbName"
              RedisUrl:
                Fn::ImportValue:
                  Fn::Sub: "${ProjectName}-${Environment}-RedisUrl"
              ArtifactBucketName:
                Fn::ImportValue:
                  Fn::Sub: "${ProjectName}-${Environment}-ArtifactBucketName"
              ReadGhcrSecret: !If
                - HasExternalGhcrTokenSecret
                - !Sub "aws secretsmanager get-secret-value --secret-id '${GhcrTokenSecretArn}' --query SecretString --output text > /opt/a360/ghcr_token"
                - !Sub "aws secretsmanager get-secret-value --secret-id '${OpsGhcrReadTokenSecret}' --query SecretString --output text > /opt/a360/ghcr_token"
              ReadRagTokenSecret: !If
                - HasExternalRagTokenSecret
                - !Sub "aws secretsmanager get-secret-value --secret-id '${RagServiceTokenSecretArn}' --query SecretString --output text > /opt/a360/rag_service_token"
                - !Sub "aws secretsmanager get-secret-value --secret-id '${RagServiceTokenSecret}' --query SecretString --output text > /opt/a360/rag_service_token"
              ReadBackendRuntimeSecret: !Sub
                - |
                  : > /opt/a360/runtime.backend.env
                  backend_secret_string=$(aws secretsmanager get-secret-value --secret-id '${BackendRuntimeSecretPath}' --query SecretString --output text 2>/dev/null || true)
                  if [ -n "$backend_secret_string" ] && printf '%s' "$backend_secret_string" | jq -e 'type == "object"' >/dev/null 2>&1; then
                    if printf '%s' "$backend_secret_string" | jq -e 'to_entries[] | select((.value | tostring | test("\\r|\\n")))' >/dev/null 2>&1; then
                      echo "Backend runtime secret values must not contain CR/LF characters for docker --env-file." >&2
                      exit 1
                    fi
                    printf '%s' "$backend_secret_string" | jq -r '
                      {
                        OPENAI_API_KEY,
                        VOYAGE_API_KEY,
                        OPENSEARCH_HOST,
                        OPENSEARCH_USERNAME,
                        OPENSEARCH_PASSWORD,
                        A360_BACKEND_OPS_API_KEY: .OPS_API_KEY
                      }
                      | to_entries[]
                      | select(.value != null and (.value | tostring) != "")
                      | "\(.key)=\(.value|tostring)"
                    ' > /opt/a360/runtime.backend.env
                  fi
                - BackendRuntimeSecretPath: !If
                    - HasBackendRuntimeSecretName
                    - !Ref BackendRuntimeSecretName
                    - !Sub "${ProjectName}/${Environment}/backend-app"
              ReadOpsRuntimeSecret: !If
                - HasExternalOpsRuntimeSecret
                - !Sub |
                  secret_string=$(aws secretsmanager get-secret-value --secret-id '${OpsRuntimeSecretArn}' --query SecretString --output text)
                  if printf '%s' "$secret_string" | jq -e 'type == "object"' >/dev/null 2>&1; then
                    if printf '%s' "$secret_string" | jq -e 'to_entries[] | select((.value | tostring | test("\\r|\\n")))' >/dev/null 2>&1; then
                      echo "Ops runtime secret values must not contain CR/LF characters for docker --env-file." >&2
                      exit 1
                    fi
                    printf '%s' "$secret_string" | jq -r 'to_entries[] | select(.value != null) | "\(.key)=\(.value|tostring)"' > /opt/a360/runtime.override.env
                  else
                    printf '%s\n' "$secret_string" > /opt/a360/runtime.override.env
                  fi
                - !Sub |
                  secret_string=$(aws secretsmanager get-secret-value --secret-id '${OpsRuntimeSecret}' --query SecretString --output text)
                  if printf '%s' "$secret_string" | jq -e 'type == "object"' >/dev/null 2>&1; then
                    if printf '%s' "$secret_string" | jq -e 'to_entries[] | select((.value | tostring | test("\\r|\\n")))' >/dev/null 2>&1; then
                      echo "Ops runtime secret values must not contain CR/LF characters for docker --env-file." >&2
                      exit 1
                    fi
                    printf '%s' "$secret_string" | jq -r 'to_entries[] | select(.value != null) | "\(.key)=\(.value|tostring)"' > /opt/a360/runtime.override.env
                  else
                    printf '%s\n' "$secret_string" > /opt/a360/runtime.override.env
                  fi
              BackendUrlEnv: !If
                - HasBackendUrl
                - !Sub "-e A360_BACKEND_URL='${A360BackendUrl}'"
                - ""
              OpsApiLogGroup: !Ref OpsBackendLogGroup
              OpsUiLogGroup: !Ref OpsUiLogGroup
              RagLogGroup: !Ref RagServerLogGroup
              RagScheduleRoleArn: !GetAtt RagScheduleRole.Arn
              RagJobQueueUrl:
                Fn::ImportValue:
                  Fn::Sub: "${ProjectName}-${Environment}-RagJobQueueUrl"
              RagJobQueueArn:
                Fn::ImportValue:
                  Fn::Sub: "${ProjectName}-${Environment}-RagJobQueueArn"
              UpsertOpsPrivateDns: !If
                - CreatesOpsPrivateDns
                - !Sub |
                  record_name=""
                  for attempt in 1 2 3 4 5; do
                    if [ -n "$PRIVATE_IP" ]; then
                      break
                    fi
                    echo "Waiting for Ops EC2 private IP before Route53 update attempt=$attempt" >&2
                    sleep $((attempt * 2))
                    PRIVATE_IP=$(curl -fsS -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4 || true)
                  done
                  if [ -z "$PRIVATE_IP" ]; then
                    echo "Skipping Ops private DNS update because private IP was not available." >&2
                  else
                    record_name="${OpsPrivateDnsRecordName}"
                    zone_name="${OpsPrivateHostedZoneName}"
                    case "$record_name" in
                      "$zone_name"|*".$zone_name") ;;
                      *)
                        echo "Skipping Ops private DNS update; record $record_name is outside hosted zone $zone_name." >&2
                        record_name=""
                        ;;
                    esac
                  fi
                  if [ -n "$record_name" ]; then
                    echo "Preparing Ops private DNS ${OpsPrivateDnsRecordName} -> $PRIVATE_IP"
                    cat > /tmp/a360-ops-private-dns.json <<DNSJSON
                  {
                    "Comment": "Point ${OpsPrivateDnsRecordName} to $INSTANCE_ID",
                    "Changes": [
                      {
                        "Action": "UPSERT",
                        "ResourceRecordSet": {
                          "Name": "${OpsPrivateDnsRecordName}.",
                          "Type": "A",
                          "TTL": 60,
                          "ResourceRecords": [
                            { "Value": "$PRIVATE_IP" }
                          ]
                        }
                      }
                    ]
                  }
                  DNSJSON
                    dns_updated=false
                    for attempt in 1 2 3 4 5; do
                      if aws route53 change-resource-record-sets \
                        --hosted-zone-id "${OpsPrivateHostedZone}" \
                        --change-batch file:///tmp/a360-ops-private-dns.json; then
                        echo "Updated Ops private DNS ${OpsPrivateDnsRecordName} -> $PRIVATE_IP"
                        dns_updated=true
                        break
                      fi
                      echo "Route53 private DNS update failed attempt=$attempt; retrying." >&2
                      sleep $((attempt * 3))
                    done
                    if [ "$dns_updated" != "true" ]; then
                      echo "Route53 private DNS update skipped after retries; bootstrap continues." >&2
                    fi
                  fi
                - ""
              RunRagWorkerContainer: !If
                - RunsRagWorker
                - !Sub
                  - |
                    docker run -d --restart unless-stopped --name rag-worker --network a360 \
                      --no-healthcheck \
                      --env-file /opt/a360/runtime.env \
                      -e AWS_REGION="${AWS::Region}" \
                      -e REDIS_URL='${RedisUrl}' \
                      -e RAG_SERVER_URL="http://rag-server:${RagServerPort}" \
                      -e RAG_INGEST_SQS_QUEUE_URL="${RagJobQueueUrl}" \
                      -e RAG_INGEST_SQS_QUEUE_ARN="${RagJobQueueArn}" \
                      -e RAG_SERVICE_TOKEN="$(cat /opt/a360/rag_service_token 2>/dev/null || true)" \
                      --log-driver awslogs --log-opt awslogs-region=${AWS::Region} --log-opt awslogs-group=${RagWorkerLogGroupName} \
                      ${OpsBackendImageUri} \
                      python -m app.scheduler.sqs_consumer
                  - RagJobQueueUrl:
                      Fn::ImportValue:
                        Fn::Sub: "${ProjectName}-${Environment}-RagJobQueueUrl"
                    RagJobQueueArn:
                      Fn::ImportValue:
                        Fn::Sub: "${ProjectName}-${Environment}-RagJobQueueArn"
                    RedisUrl:
                      Fn::ImportValue:
                        Fn::Sub: "${ProjectName}-${Environment}-RedisUrl"
                    RagWorkerLogGroupName: !Ref RagWorkerLogGroup
                - ""

  OpsAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    CreationPolicy:
      ResourceSignal:
        Count: !Ref DesiredCapacity
        Timeout: PT15M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 0
        MaxBatchSize: 1
        PauseTime: PT15M
        WaitOnResourceSignals: true
    Properties:
      MinSize: !Ref MinSize
      DesiredCapacity: !Ref DesiredCapacity
      MaxSize: !Ref MaxSize
      VPCZoneIdentifier:
        Fn::Split:
          - ","
          - Fn::ImportValue:
              Fn::Sub: "${ProjectName}-${Environment}-PrivateOpsSubnetIds"
      HealthCheckType: EC2
      HealthCheckGracePeriod: 600
      LaunchTemplate:
        LaunchTemplateId: !Ref OpsLaunchTemplate
        Version: !GetAtt OpsLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ops"
          PropagateAtLaunch: true
        - Key: Project
          Value: !Ref ProjectName
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref Environment
          PropagateAtLaunch: true
        - Key: Owner
          Value: !Ref Owner
          PropagateAtLaunch: true

  RagScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: send-rag-job
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  Fn::ImportValue:
                    Fn::Sub: "${ProjectName}-${Environment}-RagJobQueueArn"

  RagSchedulerGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-rag-ingest"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner

  DefaultRagIngestSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: CreatesDefaultRagIngestSchedule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-rag-ingest-daily"
      GroupName: !Ref RagSchedulerGroup
      ScheduleExpression: !Ref RagIngestScheduleExpression
      ScheduleExpressionTimezone: !Ref RagIngestScheduleTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn:
          Fn::ImportValue:
            Fn::Sub: "${ProjectName}-${Environment}-RagJobQueueArn"
        RoleArn: !GetAtt RagScheduleRole.Arn
        Input: !Sub |
          {
            "type": "rag_ingest",
            "schedule_id": "${ProjectName}-${Environment}-rag-ingest-daily",
            "option": 3,
            "clean": ${RagIngestClean},
            "requested_by": "eventbridge-scheduler",
            "source": "cloudformation-default"
          }
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2

Outputs:
  OpsGhcrReadTokenSecretArn:
    Description: GHCR read token secret ARN used by Ops EC2 image pulls.
    Value: !If [HasExternalGhcrTokenSecret, !Ref GhcrTokenSecretArn, !Ref OpsGhcrReadTokenSecret]
    Export:
      Name: !Sub "${ProjectName}-${Environment}-OpsGhcrReadTokenSecretArn"
  OpsRuntimeSecretArn:
    Description: Extra runtime environment secret ARN used by Ops backend and RAG server.
    Value: !If [HasExternalOpsRuntimeSecret, !Ref OpsRuntimeSecretArn, !Ref OpsRuntimeSecret]
    Export:
      Name: !Sub "${ProjectName}-${Environment}-OpsRuntimeSecretArn"
  RagServiceTokenSecretArn:
    Description: Shared RAG service bearer token secret ARN.
    Value: !If [HasExternalRagTokenSecret, !Ref RagServiceTokenSecretArn, !Ref RagServiceTokenSecret]
    Export:
      Name: !Sub "${ProjectName}-${Environment}-RagServiceTokenSecretArn"
  OpsInstanceSecurityGroupId:
    Value: !Ref OpsInstanceSecurityGroup
    Export:
      Name: !Sub "${ProjectName}-${Environment}-OpsInstanceSecurityGroupId"
  OpsAutoScalingGroupName:
    Value: !Ref OpsAutoScalingGroup
  OpsUiPort:
    Description: Streamlit UI port reachable on the Ops EC2 private IP through Client VPN.
    Value: !Ref OpsUiPort
  OpsBackendPort:
    Description: Ops backend API port reachable on the Ops EC2 private IP through Client VPN.
    Value: !Ref OpsBackendPort
  OpsPrivateDnsName:
    Condition: CreatesOpsPrivateDns
    Description: Route53 private DNS name for the Ops Streamlit UI. Use this through Client VPN.
    Value: !Ref OpsPrivateDnsRecordName
    Export:
      Name: !Sub "${ProjectName}-${Environment}-OpsPrivateDnsName"
  OpsPrivateHostedZoneId:
    Condition: CreatesOpsPrivateDns
    Description: Route53 private hosted zone ID used for Ops direct access.
    Value: !Ref OpsPrivateHostedZone
    Export:
      Name: !Sub "${ProjectName}-${Environment}-OpsPrivateHostedZoneId"
  RagScheduleRoleArn:
    Description: EventBridge Scheduler execution role used for RAG ingest schedules.
    Value: !GetAtt RagScheduleRole.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-RagScheduleRoleArn"
  RagSchedulerGroupName:
    Description: EventBridge Scheduler group for RAG ingest jobs.
    Value: !Ref RagSchedulerGroup
    Export:
      Name: !Sub "${ProjectName}-${Environment}-RagSchedulerGroupName"
  DefaultRagIngestScheduleName:
    Condition: CreatesDefaultRagIngestSchedule
    Description: Default EventBridge Scheduler schedule for RAG ingest jobs.
    Value: !Ref DefaultRagIngestSchedule
    Export:
      Name: !Sub "${ProjectName}-${Environment}-DefaultRagIngestScheduleName"
